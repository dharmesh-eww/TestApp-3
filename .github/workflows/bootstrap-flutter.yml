name: Bootstrap Flutter Android project

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  create-flutter-project:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Flutter Android project
        run: flutter create --platforms=android --project-name testapp_3 .

      - name: Commit generated Flutter project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Create Flutter Android project"
            git push
          else
            echo "No generated changes to commit."
          fi
